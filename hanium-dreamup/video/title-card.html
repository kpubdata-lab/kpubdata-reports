<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>T1 제목 카드</title>
<!-- 시연 영상 T1 제목 카드(1920×1080). 색·로고는 KPubData Brand v2(kpubdata-studio docs/brand/VISUAL_IDENTITY.md). -->
<style>
  @font-face {
    font-family: "Pretendard";
    src: url("PretendardVariable.woff2") format("woff2");
    font-weight: 100 900;
  }
  :root {
    --ink: #172033;
    --slate: #64748B;
    --brand-blue: #2563EB;
    --surface: #FFFFFF;
  }
  html, body { margin: 0; }
  body {
    width: 1920px;
    height: 1080px;
    background: var(--surface);
    font-family: "Pretendard", sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    word-break: keep-all;
  }
  .symbol { width: 144px; height: 144px; margin-bottom: 56px; }
  .kicker { font-size: 38px; font-weight: 600; color: var(--slate); letter-spacing: 0.02em; }
  .rule { width: 96px; height: 4px; background: var(--brand-blue); margin: 36px 0 40px; border-radius: 2px; }
  h1 { margin: 0; font-size: 88px; font-weight: 800; line-height: 1.28; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <img class="symbol" src="symbol_light.svg" alt="KPubData">
  <div class="kicker">2026 한이음 드림업</div>
  <div class="rule"></div>
  <h1>공공데이터 AI 데이터셋<br>자동 표준화 및 검증 플랫폼 개발</h1>
</body>
</html>
